; PHP runtime overrides for Z-Push under Plesk/Docker.
;
; The base php:8.2-apache image ships with no active php.ini (only the
; php.ini-production/-development templates, neither of which is enabled),
; so PHP falls back to its compiled-in defaults - notably display_errors=On.
; Z-Push 2.7.6's code predates PHP 8.1's null-to-non-nullable-parameter
; deprecations (e.g. stripos()/lib/request/request.php), so it emits PHP
; Deprecated/Warning/Fatal output routinely. With display_errors on, any of
; that gets written straight into the HTTP response body, which:
;   - corrupts the binary WBXML ActiveSync protocol stream sent to mobile
;     clients (breaking sync in ways that are hard to trace back to this), and
;   - leaks internal server file paths/stack traces to anyone who can reach
;     the endpoint.
; Errors are still fully captured - just to a log file instead of the wire.
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_log = /var/log/z-push/php-error.log
error_reporting = E_ALL
