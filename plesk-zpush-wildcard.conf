# Plesk Nginx Location Directive for Z-Push ActiveSync Proxy
# Place this inside Nginx server block or use Plesk template system

location /Microsoft-Server-ActiveSync {
    proxy_pass http://127.0.0.1:8080/Microsoft-Server-ActiveSync;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_pass_header Authorization;
    
    # Extended timeouts for ActiveSync Long Polling / Ping
    proxy_connect_timeout 3600s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    
    # Disable buffering for real-time push notifications
    proxy_buffering off;
    client_max_body_size 20M;
}

location /autodiscover/autodiscover.xml {
    proxy_pass http://127.0.0.1:8080/autodiscover/autodiscover.xml;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /Autodiscover/Autodiscover.xml {
    proxy_pass http://127.0.0.1:8080/Autodiscover/Autodiscover.xml;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
