<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /usr/share/z-push

    # Alias for ActiveSync requests
    Alias /Microsoft-Server-ActiveSync /usr/share/z-push/index.php
    Alias /autodiscover/autodiscover.xml /usr/share/z-push/autodiscover/autodiscover.php
    Alias /Autodiscover/Autodiscover.xml /usr/share/z-push/autodiscover/autodiscover.php

    <Directory "/usr/share/z-push">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_php.c>
            php_flag magic_quotes_gpc off
            php_flag register_globals off
            php_flag magic_quotes_runtime off
            php_flag short_open_tag on
        </IfModule>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/zpush_error.log
    CustomLog ${APACHE_LOG_DIR}/zpush_access.log combined
</VirtualHost>
